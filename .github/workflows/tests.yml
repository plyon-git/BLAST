name: Blastio safeguards
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  safeguards:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      BLASTIO_MODE: simulation
      BLASTIO_ALLOW_PRODUCTION: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m compileall -q blastio
      - run: node --check blastio/static/app.js
